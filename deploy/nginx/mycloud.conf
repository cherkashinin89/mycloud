server {
    listen 5001;
    server_name _;

    client_max_body_size 500M;

    access_log /var/log/nginx/mycloud_access.log;
    error_log  /var/log/nginx/mycloud_error.log;

    # Общие статики из myframework (через алиас)
    location /static/shared/ {
        alias /home/admin/apps/myframework/static/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Свои статики облака
    location /static/ {
        alias /home/admin/apps/mycloud/static/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Загруженные файлы облака
    location /cloud_data/ {
        alias /home/admin/apps/mycloud/cloud_data/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Всё остальное — на Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}